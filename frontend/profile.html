<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — CSU Lost &amp; Found</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="app-nav">
    <div class="app-nav-inner">
    <a href="index.html" class="app-brand">
    <span class="app-brand-mark">
        <img src="images/logo.png" alt="CSU Logo">
    </span>
    <span class="app-brand-text">CSU <span style="color:var(--csu-gold);">Lost&amp;Found</span></span>
</a>
        <div class="app-nav-links">
            <a href="dashboard.html">Items</a>
            <a href="my-claims.html">My Claims</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="#" onclick="logout()" style="color:#dc2626;">Logout</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width:640px;">
    <h1 style="font-size:1.75rem;margin-bottom:1.5rem;">My Profile</h1>

    <div class="card mb-6">
        <h3 style="margin-bottom:1rem;">Account Information</h3>
        <div style="display:flex;flex-direction:column;gap:1rem;">
            <div>
                <label class="field-label" for="name">Name</label>
                <input type="text" id="name" class="input">
            </div>
            <div>
                <label class="field-label" for="email">Email</label>
                <input type="email" id="email" class="input">
            </div>
            <button onclick="saveProfile()" class="btn btn-primary">Update Profile</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom:1rem;">Change Password</h3>
        <div style="display:flex;flex-direction:column;gap:1rem;">
            <div>
                <label class="field-label" for="oldPassword">Current Password</label>
                <input type="password" id="oldPassword" class="input">
            </div>
            <div>
                <label class="field-label" for="newPassword">New Password</label>
                <input type="password" id="newPassword" class="input">
            </div>
            <button onclick="savePassword()" class="btn btn-gold">Change Password</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/effects.js"></script>
<script>
    requireAuth();
    async function load() {
        try {
            const u = await authAPI.getProfile();
            document.getElementById('name').value = u.name;
            document.getElementById('email').value = u.email;
        } catch (e) { showToast(e.message, 'error'); }
    }
    async function saveProfile() {
        try {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const u = await authAPI.updateProfile({ name, email });
            localStorage.setItem('user', JSON.stringify(u));
            showToast('Profile updated');
        } catch (e) { showToast(e.message, 'error'); }
    }
    async function savePassword() {
        try {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            await authAPI.changePassword({ oldPassword, newPassword });
            showToast('Password changed');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
        } catch (e) { showToast(e.message, 'error'); }
    }
    load();
</script>
</body>
</html>
