<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/global.css"></head>
<body class="bg-[var(--bg-light)]"><div class="max-w-md mx-auto mt-20 p-6 bg-white dark:bg-gray-800 rounded shadow"><h2 class="text-2xl mb-4" style="color:var(--primary)">My Profile</h2><div class="mb-2"><label>Name</label><input type="text" id="name" class="w-full p-2 border rounded"></div><div class="mb-2"><label>Email</label><input type="email" id="email" class="w-full p-2 border rounded"></div><button onclick="updateProfile()" class="btn-primary w-full">Update Profile</button><hr class="my-4"><h3>Change Password</h3><div class="mb-2"><label>Old Password</label><input type="password" id="oldPassword" class="w-full p-2 border rounded"></div><div><label>New Password</label><input type="password" id="newPassword" class="w-full p-2 border rounded"></div><button onclick="changePassword()" class="btn-primary w-full mt-4">Change Password</button></div><script src="js/api.js"></script><script src="js/auth.js"></script><script>if(!localStorage.getItem('token'))location.href='login.html';async function updateProfile(){const name=document.getElementById('name').value,email=document.getElementById('email').value;await authAPI.updateProfile({name,email});alert('Profile updated');}async function changePassword(){const oldPassword=document.getElementById('oldPassword').value,newPassword=document.getElementById('newPassword').value;await authAPI.changePassword({oldPassword,newPassword});alert('Password changed');}async function loadProfile(){const user=await authAPI.getProfile();document.getElementById('name').value=user.name;document.getElementById('email').value=user.email;}loadProfile();</script></body></html>
