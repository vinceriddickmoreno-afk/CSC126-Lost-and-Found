<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSU Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="liquid-bg">
        <div class="liquid-blob b1"></div>
        <div class="liquid-blob b2"></div>
        <div class="liquid-blob b3"></div>
        <div class="liquid-blob b4"></div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="images/logo.png" alt="Logo">
            CSU Lost & Found
        </a>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="dashboard.html">Items</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <main class="hero-container">
        <div class="hero-content glass">
            <div class="badge">Caraga State University - Main Campus</div>
            <h1 class="hero-title">
                Lost something<br>
                <span class="gradient-text">on campus again?</span>
            </h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem;">
                Report lost belongings, browse found items, and claim what's yours. 
                A smarter, faster way to reunite the CSU community with their valuables.
            </p>
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <a href="dashboard.html" class="btn btn-secondary">Browse Items</a>
                <a href="register.html" class="btn btn-primary">Create Account</a>
            </div>
        </div>
    </main>
</body>
</html>
