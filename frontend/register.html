<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - CSU Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="liquid-bg"><div class="liquid-blob b3"></div><div class="liquid-blob b4"></div></div>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><img src="images/logo.png" alt="Logo"> CSU Lost & Found</a>
    </nav>
    <div class="auth-wrap">
        <div class="auth-card glass">
            <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required minlength="8">
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Min 8 chars, 1 upper, 1 lower, 1 number.</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
