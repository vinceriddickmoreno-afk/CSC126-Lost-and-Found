<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — CSU Lost &amp; Found</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-title">
            <h1>Create account</h1>
            <p>Join the CSU Lost &amp; Found community</p>
        </div>
        <form id="registerForm" class="auth-form">
            <div>
                <label class="field-label" for="name">Full Name</label>
                <input type="text" id="name" class="input" required>
            </div>
            <div>
                <label class="field-label" for="email">Email</label>
                <input type="email" id="email" class="input" required>
            </div>
            <div>
                <label class="field-label" for="password">Password</label>
                <input type="password" id="password" class="input" required minlength="6">
            </div>
            <div>
                <label class="field-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="input" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;">Create Account</button>
        </form>
        <p style="text-align:center;margin-top:1.25rem;font-size:.88rem;color:var(--text-muted);">
            Already have an account? <a href="login.html" style="font-weight:600;">Sign in</a>
        </p>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/effects.js"></script>
</body>
</html>
