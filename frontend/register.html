<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/global.css"></head>
<body class="bg-[var(--bg-light)]"><div class="max-w-md mx-auto mt-20 p-6 bg-white dark:bg-gray-800 rounded shadow"><h2 class="text-2xl mb-4" style="color:var(--primary)">Register</h2><form id="registerForm"><input type="text" id="name" placeholder="Full Name" class="w-full p-2 border mb-2 rounded" required><input type="email" id="email" placeholder="Email" class="w-full p-2 border mb-2 rounded" required><input type="password" id="password" placeholder="Password (min 6)" class="w-full p-2 border mb-2 rounded" required><input type="password" id="confirmPassword" placeholder="Confirm Password" class="w-full p-2 border mb-4 rounded" required><button type="submit" class="btn-primary w-full">Register</button></form><p class="mt-4 text-center">Already have an account? <a href="login.html" style="color:var(--primary)">Login</a></p></div><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
