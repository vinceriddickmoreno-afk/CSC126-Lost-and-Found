<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CSU Lost &amp; Found</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="app-nav">
    <div class="app-nav-inner">
<a href="index.html" class="app-brand">
    <span class="app-brand-mark">
        <img src="images/logo.png" alt="CSU Logo">
    </span>
    <span class="app-brand-text">CSU <span style="color:var(--csu-gold);">Lost&amp;Found</span></span>
</a>
        <div class="app-nav-links">
            <a href="dashboard.html">Items</a>
            <a href="my-claims.html">My Claims</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" class="active">Admin</a>
            <a href="#" onclick="logout()" style="color:#dc2626;">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 style="font-size:1.75rem;margin-bottom:1.5rem;">Admin Dashboard</h1>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1.5rem;">
        <div class="card">
            <div style="font-size:.8rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Total Items</div>
            <div id="totalItems" style="font-size:2rem;font-weight:800;margin-top:.25rem;">-</div>
        </div>
        <div class="card">
            <div style="font-size:.8rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Total Claims</div>
            <div id="totalClaims" style="font-size:2rem;font-weight:800;margin-top:.25rem;">-</div>
        </div>
        <div class="card">
            <div style="font-size:.8rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Pending</div>
            <div id="pendingClaims" style="font-size:2rem;font-weight:800;margin-top:.25rem;">-</div>
        </div>
    </div>

    <h2 style="font-size:1.25rem;margin-bottom:1rem;">All Claims</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>ID</th><th>Item</th><th>Claimant</th><th>Message</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="claimsTableBody"></tbody>
        </table>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/effects.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
