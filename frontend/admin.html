<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/global.css"></head>
<body class="bg-[var(--bg-light)]"><nav class="bg-white shadow sticky top-0 z-50 dark:bg-[#0a192f]"><div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between"><a href="index.html" class="text-2xl font-bold" style="color:var(--primary)">Admin Panel</a><a href="#" onclick="logout()" class="text-red-600">Logout</a></div></nav>
<div class="max-w-7xl mx-auto p-4"><h1 class="text-2xl font-bold mb-4">Admin Dashboard</h1><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"><div class="bg-white dark:bg-gray-800 p-4 rounded shadow">Total Items: <span id="totalItems">-</span></div><div class="bg-white dark:bg-gray-800 p-4 rounded shadow">Total Claims: <span id="totalClaims">-</span></div><div class="bg-white dark:bg-gray-800 p-4 rounded shadow">Pending Claims: <span id="pendingClaims">-</span></div></div>
<h2 class="text-xl mb-2">All Claims</h2><div class="overflow-x-auto"><table class="w-full bg-white dark:bg-gray-800 rounded shadow"><thead><tr class="bg-gray-200 dark:bg-gray-700"><th class="p-2">ID</th><th>Item</th><th>Claimant</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead><tbody id="claimsTableBody"></tbody></table></div></div><script src="js/api.js"></script><script src="js/admin.js"></script><script>if(!localStorage.getItem('token'))location.href='login.html';</script></body></html>
