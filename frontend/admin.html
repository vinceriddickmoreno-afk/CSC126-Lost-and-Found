<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="liquid-bg"><div class="liquid-blob b1"></div></div>
    
    <nav class="navbar">
        <div class="nav-brand"><img src="images/logo.png" alt="Logo"> CSU Lost & Found</div>
        <div class="nav-links">
            <a href="dashboard.html">Items</a>
            <a href="admin.html" class="active">Admin Panel</a>
            <a href="#" id="logoutBtn" style="color: #fca5a5;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 2rem;">Admin Dashboard</h1>
        
        <div class="grid" style="margin-bottom: 2rem;">
            <div class="card glass"><h3>Total Users</h3><p id="statUsers" style="font-size: 2rem; color: var(--csu-gold);">0</p></div>
            <div class="card glass"><h3>Total Items</h3><p id="statItems" style="font-size: 2rem; color: var(--csu-gold);">0</p></div>
            <div class="card glass"><h3>Pending Claims</h3><p id="statClaims" style="font-size: 2rem; color: var(--csu-gold);">0</p></div>
        </div>

        <h2 style="margin-bottom: 1rem;">Manage Claims</h2>
        <div class="table-wrap glass" style="padding: 1rem;">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Claimant</th>
                        <th>Contact</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="claimsTableBody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
