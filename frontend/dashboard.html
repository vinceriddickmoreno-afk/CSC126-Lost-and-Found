<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - CSU Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="liquid-bg"><div class="liquid-blob b1"></div><div class="liquid-blob b2"></div></div>
    
    <nav class="navbar">
        <div class="nav-brand"><img src="images/logo.png" alt="Logo"> CSU Lost & Found</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Items</a>
            <a href="my-claims.html">My Claims</a>
            <a href="#" id="logoutBtn" style="color: #fca5a5;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="flex-between">
            <h1>All Items</h1>
            <button class="btn btn-primary" onclick="document.getElementById('reportModal').classList.add('active')">+ Report Item</button>
        </div>

        <!-- Search & Filters -->
        <div class="filters-bar">
            <input type="text" placeholder="Search items...">
            <select>
                <option>All Categories</option>
                <option>Wallet</option>
                <option>Electronics</option>
                <option>ID Card</option>
            </select>
            <select>
                <option>All Status</option>
                <option>Lost</option>
                <option>Found</option>
            </select>
        </div>

        <!-- Items Grid -->
        <div class="grid" id="itemsContainer">
            <p style="color: white;">Loading items...</p>
        </div>
    </div>

    <!-- REPORT ITEM MODAL -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal-content glass">
            <h2 style="margin-bottom:1rem;">Report an Item</h2>
            <form id="itemForm">
                <div class="form-group"><label>Title</label><input type="text" name="title" required></div>
                <div class="form-group"><label>Description (Optional - AI will fill if blank)</label><input type="text" name="description"></div>
                <div class="form-group"><label>Location</label><input type="text" name="location"></div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="Other">Other</option><option value="Wallet">Wallet</option>
                        <option value="Electronics">Electronics</option><option value="ID Card">ID Card</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status"><option value="lost">Lost</option><option value="found">Found</option></select>
                </div>
                <div class="form-group"><label>Image</label><input type="file" name="image" accept="image/*"></div>
                <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">Submit</button>
                    <button type="button" class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('reportModal').classList.remove('active')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- COMBINED VIEW & CLAIM MODAL -->
    <div class="modal-overlay" id="viewItemModal">
        <div class="modal-content glass" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
            
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <h2 id="viewItemTitle" style="margin: 0;">Item Title</h2>
                <span id="viewItemStatus" class="pill">status</span>
            </div>
            
            <!-- Large Image Display -->
            <img id="viewItemImage" src="" alt="Item Image" style="width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; margin-bottom: 1rem; background: rgba(0,0,0,0.2); display: none;">
            
            <!-- AI Analysis Box -->
            <div style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border-left: 4px solid var(--csu-gold);">
                <p style="margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--csu-gold); text-transform: uppercase; font-weight: bold;">AI Analysis:</p>
                <p id="viewItemDesc" style="color: var(--text); line-height: 1.4;">Description</p>
            </div>
            
            <p style="margin-bottom: 1rem;"><strong>Location:</strong> <span id="viewItemLocation" style="color: var(--text-muted);"></span></p>
            
            <!-- The Claim Form -->
            <div id="viewClaimSection" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; margin-top: 1rem;">
                <h3 style="margin-bottom: 1rem; color: #fff;">Claim this item</h3>
                <form id="viewClaimForm">
                    <input type="hidden" id="viewClaimItemId">
                    <div class="form-group">
                        <label>Message to Owner</label>
                        <input type="text" name="message" placeholder="Describe your item..." required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" name="contactNumber" placeholder="09123456789" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Claim</button>
                </form>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-secondary" style="width: 100%;" onclick="document.getElementById('viewItemModal').classList.remove('active')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
