<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CSU Lost &amp; Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="app-nav">
        <div class="app-nav-inner">
<a href="index.html" class="app-brand">
    <span class="app-brand-mark">
        <img src="images/logo.png" alt="CSU Logo">
    </span>
    <span class="app-brand-text">CSU <span style="color:var(--csu-gold);">Lost&amp;Found</span></span>
</a>
            <div class="app-nav-links">
                <a href="dashboard.html" class="active">Items</a>
                <a href="my-claims.html">My Claims</a>
                <a href="profile.html">Profile</a>
                <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
                <a href="#" onclick="logout()" style="color:#dc2626;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="flex flex-wrap"
            style="justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;">
            <h1 style="font-size:1.75rem;">All Items</h1>
            <button onclick="openAddModal()" class="btn btn-primary">+ Report Item</button>
        </div>

        <div class="flex flex-wrap gap-3 mb-6">
            <input type="text" id="searchInput" class="input" placeholder="Search..." style="flex:1;min-width:200px;">
            <select id="categoryFilter" class="select" style="max-width:180px;">
                <option value="">All Categories</option>
                <option>Wallet</option>
                <option>Electronics</option>
                <option>Bag</option>
                <option>Bottle</option>
                <option>ID Card</option>
                <option>Keys</option>
                <option>Other</option>
            </select>
            <select id="statusFilter" class="select" style="max-width:160px;">
                <option value="">All Status</option>
                <option>lost</option>
                <option>found</option>
                <option>claimed</option>
                <option>returned</option>
            </select>
            <button id="searchBtn" class="btn btn-primary">Search</button>
            <button onclick="exportToCSV()" class="btn btn-ghost">📥 CSV</button>
        </div>

        <div id="itemsContainer" class="grid grid-items"></div>
    </div>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-panel">
            <h3 id="modalTitle" style="margin-bottom:1.25rem;">Report Item</h3>
            <form id="itemForm" style="display:flex;flex-direction:column;gap:1rem;">
                <div>
                    <label class="field-label" for="itemTitle">Title *</label>
                    <input type="text" id="itemTitle" class="input" required>
                </div>
                <div>
                    <label class="field-label" for="itemDescription">Description</label>
                    <textarea id="itemDescription" rows="3" class="textarea"></textarea>
                </div>
                <div>
                    <label class="field-label" for="itemCategory">Category</label>
                    <select id="itemCategory" class="select">
                        <option>Wallet</option>
                        <option>Electronics</option>
                        <option>Bag</option>
                        <option>Bottle</option>
                        <option>ID Card</option>
                        <option>Keys</option>
                        <option>Other</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="itemLocation">Location</label>
                    <input type="text" id="itemLocation" class="input">
                </div>
                <div>
                    <label class="field-label" for="itemStatus">Status</label>
                    <select id="itemStatus" class="select">
                        <option value="lost">Lost</option>
                        <option value="found">Found</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="itemImage">Image</label>
                    <input type="file" id="itemImage" accept="image/*" class="input">
                </div>
                <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem;">
                    <button type="button" onclick="closeModal()" class="btn btn-ghost">Cancel</button>
                    <button type="button" onclick="saveItem()" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/effects.js"></script>
    <script>
        const u = getCurrentUser();
        if (u && u.role === 'admin') document.getElementById('adminLink').style.display = 'inline-block';
    </script>
</body>

</html>
